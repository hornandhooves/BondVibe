name: E2E - login (Maestro, alpha)

# Trigger manual a proposito: cada corrida de "build_e2e_android" consume
# cuota real de EAS builds. No se dispara solo en cada PR hasta que se
# confirme la cuota disponible (ver comentario de Carlos en PR #177).
# Correr con: eas workflow:run e2e-login.yml
on:
  workflow_dispatch: {}

jobs:
  build_e2e_android:
    name: Build APK para E2E
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_login:
    name: Maestro - flujo de login
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path: .maestro/p0-login.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}
