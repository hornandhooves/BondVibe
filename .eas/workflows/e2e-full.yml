name: E2E - full suite (Maestro, alpha)

# Consolidado de e2e-login.yml + e2e-staff.yml + e2e-batch1.yml (KIN-268):
# un solo build_e2e_android compartido por los 8 jobs de Maestro en vez de
# 3 builds separados -- el costo de EAS Build es por archivo de workflow,
# no por job de Maestro dentro de el, asi que separarlos en 3 archivos no
# compraba nada y triplicaba el gasto de cuota sin razon.
#
# Trigger manual a proposito: cada corrida consume 1 build real de EAS.
# No se dispara solo hasta que Carlos lo autorice explicitamente.
# Correr con: eas workflow:run e2e-full.yml
on:
  workflow_dispatch: {}

jobs:
  build_e2e_android:
    name: Build APK para E2E
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_login:
    name: Maestro - flujo de login
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path: .maestro/p0-login.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  # Sesion HOST (jcpuntoduarte@gmail.com): login + invita a la cuenta de staff
  # por email. flow_path acepta array -- corre los dos flujos en la misma
  # sesion de Maestro (docs.expo.dev/eas/workflows/pre-packaged-jobs/).
  maestro_staff_invite:
    name: Maestro - host invita staff
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-staff-invite.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}
      KINLO_STAFF_EMAIL: ${{ env.KINLO_E2E_STAFF_EMAIL }}

  # Sesion STAFF (ahronyswow@gmail.com): login + acepta la invitacion desde
  # el Inbox. needs incluye maestro_staff_invite para que corra DESPUES --
  # depende de que la invitacion ya exista, no solo del build.
  maestro_staff_accept:
    name: Maestro - staff acepta invitacion
    type: maestro
    needs: [build_e2e_android, maestro_staff_invite]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-staff-accept.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_STAFF_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_STAFF_PASSWORD }}

  # No requiere login -- prueba el shell de Welcome antes de autenticar.
  maestro_smoke_logged_out:
    name: Maestro - smoke logueado fuera
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path: .maestro/p0-smoke-logged-out.yaml

  maestro_smoke_tabs:
    name: Maestro - smoke 5 tabs + toggle hosting/attending
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/p0-smoke-tabs.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  # Cuenta host confirmada con AI opt-in activo (Carlos, 2-sep-2026).
  maestro_attendee:
    name: Maestro - journey de attendee
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-attendee.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  maestro_create_event:
    name: Maestro - host crea evento
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-create-event.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  maestro_notifications:
    name: Maestro - abre notificaciones
    type: maestro
    needs: [build_e2e_android]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-notifications.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  # =========================================================================
  # KIN-275 — fixtures baratos para Maestro (seed -> maestro -> cleanup).
  #
  # join-event y membership-redeem comparten el mismo mecanismo de
  # descubribilidad ("primer resultado de busqueda" = evento mas proximo
  # publicamente listado) y por lo tanto el mismo riesgo de colision si sus
  # fixtures coexisten. Cada script se auto-verifica y aborta si no hay hueco
  # seguro (ver headers de scripts/e2e-seed-join-event.mjs y
  # scripts/e2e-seed-membership-redeem.mjs), pero ademas los serializamos
  # aqui con `needs` para que nunca esten vivos al mismo tiempo.
  #
  # PENDIENTE, sin resolver (KIN-275): estos scripts corren hoy con las
  # credenciales locales de gcloud/Firebase CLI del operador via Application
  # Default Credentials. Ese contexto no existe en un runner de EAS -- falta
  # decidir e implementar autenticacion via service-account key (EAS
  # Environment Variable / secret) antes de poder correr este workflow de
  # punta a punta. Hasta entonces estos jobs fallaran en la autenticacion de
  # firebase-admin -- de forma explicita, no en silencio.
  # =========================================================================

  seed_join_event:
    name: KIN-275 - seed join-event
    needs: [build_e2e_android]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-seed-join-event.mjs

  maestro_join_event:
    name: Maestro - join-event
    type: maestro
    needs: [build_e2e_android, seed_join_event]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-join-event.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  cleanup_join_event:
    name: KIN-275 - cleanup join-event
    needs: [maestro_join_event]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-cleanup-join-event.mjs

  seed_membership_redeem:
    name: KIN-275 - seed membership-redeem
    needs: [cleanup_join_event]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
    steps:
      - run: node scripts/e2e-seed-membership-redeem.mjs

  maestro_membership_redeem:
    name: Maestro - membership-redeem
    type: maestro
    needs: [build_e2e_android, seed_membership_redeem]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-membership-redeem.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  cleanup_membership_redeem:
    name: KIN-275 - cleanup membership-redeem
    needs: [maestro_membership_redeem]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-cleanup-membership-redeem.mjs

  # email-gate no toca la coleccion events -- no comparte el riesgo de
  # colision de arriba, corre en paralelo (solo depende del build).
  # Requiere las EAS Environment Variables KINLO_UNVERIFIED_EMAIL /
  # KINLO_UNVERIFIED_PASSWORD, todavia no creadas (pendiente KIN-275).
  seed_email_gate:
    name: KIN-275 - seed email-gate
    needs: [build_e2e_android]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-seed-email-gate.mjs

  maestro_email_gate:
    name: Maestro - email-gate
    type: maestro
    needs: [build_e2e_android, seed_email_gate]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path: .maestro/e2e-email-gate.yaml
    env:
      KINLO_UNVERIFIED_EMAIL: ${{ env.KINLO_UNVERIFIED_EMAIL }}
      KINLO_UNVERIFIED_PASSWORD: ${{ env.KINLO_UNVERIFIED_PASSWORD }}

  cleanup_email_gate:
    name: KIN-275 - cleanup email-gate
    needs: [maestro_email_gate]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-cleanup-email-gate.mjs


  # =========================================================================
  # KIN-275 — fixtures medios para Maestro (seed -> maestro -> cleanup).
  #
  # rental-pay y service-pay dependen de una heuristica de prefijo de ID
  # ("00_") sobre queries de Firestore SIN orderBy (vehicles, sessionTypes) --
  # decision explicita de Carlos, riesgo documentado en Jira KIN-275
  # (comentario 10446) y KIN-185 (comentario 10447), no repetido aqui.
  #
  # dm-send y wall-post-follow no comparten ese riesgo: dms tiene orderBy
  # real (updatedAt) y wall-post-follow usa un usuario QA dedicado, no una
  # cuenta real, para no ensuciar el grafo social de nadie.
  #
  # Los 4 pares corren en paralelo entre si y con los baratos -- solo
  # dependen del build. Mismo PENDIENTE de autenticacion en runner de EAS
  # que los baratos (linea 140 arriba).
  # =========================================================================

  seed_rental_pay:
    name: KIN-275 - seed rental-pay
    needs: [build_e2e_android]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-seed-rental-pay.mjs

  maestro_rental_pay:
    name: Maestro - rental-pay
    type: maestro
    needs: [build_e2e_android, seed_rental_pay]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-rental-pay.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  cleanup_rental_pay:
    name: KIN-275 - cleanup rental-pay
    needs: [maestro_rental_pay]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-cleanup-rental-pay.mjs

  seed_service_pay:
    name: KIN-275 - seed service-pay
    needs: [build_e2e_android]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-seed-service-pay.mjs

  maestro_service_pay:
    name: Maestro - service-pay
    type: maestro
    needs: [build_e2e_android, seed_service_pay]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-service-pay.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  cleanup_service_pay:
    name: KIN-275 - cleanup service-pay
    needs: [maestro_service_pay]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-cleanup-service-pay.mjs

  seed_dm_send:
    name: KIN-275 - seed dm-send
    needs: [build_e2e_android]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
    steps:
      - run: node scripts/e2e-seed-dm-send.mjs

  maestro_dm_send:
    name: Maestro - dm-send
    type: maestro
    needs: [build_e2e_android, seed_dm_send]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-dm-send.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  cleanup_dm_send:
    name: KIN-275 - cleanup dm-send
    needs: [maestro_dm_send]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-cleanup-dm-send.mjs

  seed_wall_post_follow:
    name: KIN-275 - seed wall-post-follow
    needs: [build_e2e_android]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
    steps:
      - run: node scripts/e2e-seed-wall-post-follow.mjs

  maestro_wall_post_follow:
    name: Maestro - wall-post-follow
    type: maestro
    needs: [build_e2e_android, seed_wall_post_follow]
    params:
      build_id: ${{ needs.build_e2e_android.outputs.build_id }}
      flow_path:
        - .maestro/p0-login.yaml
        - .maestro/e2e-wall-post-follow.yaml
    env:
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
      KINLO_PASSWORD: ${{ env.KINLO_E2E_PASSWORD }}

  cleanup_wall_post_follow:
    name: KIN-275 - cleanup wall-post-follow
    needs: [maestro_wall_post_follow]
    env:
      GOOGLE_CLOUD_PROJECT: kinlo-app-dev
      KINLO_EMAIL: ${{ env.KINLO_E2E_EMAIL }}
    steps:
      - run: node scripts/e2e-cleanup-wall-post-follow.mjs
